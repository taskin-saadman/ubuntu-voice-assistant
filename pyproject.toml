[project]
name = "ubuntu-voice-assistant"
version = "0.0.0"
description = "Local Ubuntu voice assistant — development tooling"
requires-python = ">=3.12,<3.13"
dependencies = [
    # faster-whisper 1.2.1 passes metadata_errors, removed in PyAV 19.
    "av>=18,<19",
    "faster-whisper==1.2.1",
    "piper-tts==1.8.0",
]

[dependency-groups]
dev = [
    "yamllint>=1.38.0,<2",
    "zizmor>=1.31.1,<2",
]

[tool.uv]
package = false
required-version = "==0.12.18"
