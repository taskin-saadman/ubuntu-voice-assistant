[project]
name = "ubuntu-voice-assistant"
version = "0.0.0"
description = "Private local Ubuntu voice assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    # faster-whisper 1.2.1 passes metadata_errors, removed in PyAV 19.
    "av>=18,<19",
    "faster-whisper==1.2.1",
    "piper-tts==1.8.0",
    "pydantic>=2.14.1,<3",
]

[dependency-groups]
dev = [
    "mypy>=2.4,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17.1,<0.18",
    "yamllint>=1.38.0,<2",
    "zizmor>=1.31.1,<2",
]

[tool.uv]
required-version = "==0.12.18"

[build-system]
requires = ["uv_build==0.12.18"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend/src"
module-name = "voice_assistant"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src", "backend/tests"]
